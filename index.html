<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>吉他音符位置检测</title>
<style>
:root{--bg:#09111f;--panel:#111c30;--text:#f5f7fb;--muted:#9ba9c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#08101d,#10192b);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{padding:14px 12px 32px}
.wrap{max-width:900px;margin:auto}
h1{font-size:23px;margin:6px 0}
.subtitle{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.card{background:#111c30;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:13px;margin-bottom:12px}
.toolbar{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
button{border:0;color:#fff;font:inherit}
.tool{border-radius:12px;padding:11px 5px;background:#263653;font-size:15px;font-weight:800}
.tool.active{outline:3px solid #fff}
.f1btn{background:#0284c7}.f2btn{background:#7c3aed}.f3btn{background:#db2777}.f4btn{background:#ea580c}
.erase{background:#475569}.clear{background:#8b1e1e}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.ctrl{padding:9px 11px;border-radius:10px;background:#24334d;font-weight:700}
.ctrl.on{background:#0369a1}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.infoBox{background:#0b1425;border-radius:12px;padding:9px;text-align:center}
.infoBox span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.infoBox b{font-size:16px}
.status{margin-top:9px;font-size:12px;color:#b9c7db}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.board{min-width:950px;padding:8px 12px 18px;background:linear-gradient(180deg,#945f39,#73452b);border-radius:14px;overflow:hidden}
.headerRow,.stringRow{display:grid;grid-template-columns:70px 55px repeat(12,1fr)}
.headerRow{height:30px;color:#f8ede5;font-size:11px;align-items:center}
.headerRow>div{text-align:center}
.stringRow{height:58px;position:relative}
.stringLabel{display:flex;align-items:center;justify-content:center;margin:10px 8px 10px 0;border-radius:9px;background:rgba(7,12,20,.72);font-size:12px;font-weight:800;position:relative;z-index:4}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-left:2px solid rgba(238,241,246,.78);cursor:pointer;touch-action:manipulation}
.cell:last-child{border-right:2px solid rgba(238,241,246,.78)}
.cell.nut{border-left:5px solid #fff}
.stringRow:after{content:"";position:absolute;left:70px;right:0;top:50%;z-index:2;pointer-events:none;height:2px;background:linear-gradient(180deg,#fff,#71717a);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.stringRow.s6:after{height:5px}.stringRow.s5:after{height:4.3px}.stringRow.s4:after{height:3.7px}.stringRow.s3:after{height:3px}.stringRow.s2:after{height:2.4px}.stringRow.s1:after{height:1.7px}
.marker{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;border:2px solid rgba(255,255,255,.8);position:relative;z-index:5;box-shadow:0 2px 7px rgba(0,0,0,.35)}
.m1{background:#0284c7}.m2{background:#7c3aed}.m3{background:#db2777}.m4{background:#ea580c}
.noteLabel{position:absolute;right:3px;bottom:2px;z-index:4;font-size:9px;font-weight:800;background:rgba(0,0,0,.4);padding:1px 3px;border-radius:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;color:#dce5f2;font-size:12px}
.dot{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.help{font-size:13px;color:var(--muted);line-height:1.7}
@media(max-width:520px){.toolbar{grid-template-columns:repeat(3,1fr)}.info{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎸 吉他音符位置检测</h1>
<div class="subtitle">选择 1 / 2 / 3 / 4，再点弦和品位。页面会自动显示第几弦、第几品、音符和频率。</div>
<section class="card">
<div class="toolbar">
<button class="tool f1btn active" data-finger="1">1 食指</button>
<button class="tool f2btn" data-finger="2">2 中指</button>
<button class="tool f3btn" data-finger="3">3 无名指</button>
<button class="tool f4btn" data-finger="4">4 小指</button>
<button class="tool erase" id="eraseBtn">⌫ 删除</button>
<button class="tool clear" id="clearBtn">清空</button>
</div>
<div class="legend">
<span><i class="dot m1">1</i> 食指</span><span><i class="dot m2">2</i> 中指</span><span><i class="dot m3">3</i> 无名指</span><span><i class="dot m4">4</i> 小指</span>
</div>
</section>
<section class="card">
<div class="controls">
<button class="ctrl on" id="noteToggle">显示音名：开</button>
<button class="ctrl on" id="soundToggle">点击发声：开</button>
<button class="ctrl" id="undoBtn">↶ 撤销</button>
</div>
<div class="info">
<div class="infoBox"><span>弦</span><b id="stringInfo">—</b></div>
<div class="infoBox"><span>品位</span><b id="fretInfo">—</b></div>
<div class="infoBox"><span>音符</span><b id="noteInfo">—</b></div>
<div class="infoBox"><span>频率</span><b id="freqInfo">—</b></div>
</div>
<div class="status" id="status">当前工具：1 食指</div>
</section>
<section class="card scroll">
<div class="board" id="board">
<div class="headerRow"><div>弦</div><div>空弦</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div></div>
<div class="stringRow s1" data-string="1" data-open-midi="64"><div class="stringLabel">1弦 E4</div></div>
<div class="stringRow s2" data-string="2" data-open-midi="59"><div class="stringLabel">2弦 B3</div></div>
<div class="stringRow s3" data-string="3" data-open-midi="55"><div class="stringLabel">3弦 G3</div></div>
<div class="stringRow s4" data-string="4" data-open-midi="50"><div class="stringLabel">4弦 D3</div></div>
<div class="stringRow s5" data-string="5" data-open-midi="45"><div class="stringLabel">5弦 A2</div></div>
<div class="stringRow s6" data-string="6" data-open-midi="40"><div class="stringLabel">6弦 E2</div></div>
</div>
</section>
<section class="card help"><b style="color:white">使用方法</b><br>① 点 1、2、3、4 选择手指。<br>② 左右滑动指板，找到品位。<br>③ 点某根弦的某一品，例如「2弦 · 1品」。<br>④ 页面自动显示 C4 等音符，并可试听。<br>⑤ 标错可用删除、撤销或清空。</section>
</div>
<script>
(function(){
"use strict";
var noteNames=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
var selected="1",erase=false,showNotes=true,soundOn=true,audioCtx=null,marks={},history=[];
try{marks=JSON.parse(localStorage.getItem("guitarMarksV2")||"{}")}catch(e){marks={}}
function noteName(midi){return noteNames[midi%12]+(Math.floor(midi/12)-1)}
function freq(midi){return 440*Math.pow(2,(midi-69)/12)}
function save(){try{localStorage.setItem("guitarMarksV2",JSON.stringify(marks))}catch(e){}}
function snapshot(){history.push(JSON.stringify(marks));if(history.length>30)history.shift()}
function key(s,f){return s+"-"+f}
function play(midi){
if(!soundOn)return;
try{
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==="suspended")audioCtx.resume();
var now=audioCtx.currentTime,f=freq(midi),out=audioCtx.createGain();
out.gain.setValueAtTime(.0001,now);out.gain.exponentialRampToValueAtTime(.18,now+.01);out.gain.exponentialRampToValueAtTime(.0001,now+1.15);out.connect(audioCtx.destination);
[1,2,3].forEach(function(h,i){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=i===0?"triangle":"sine";o.frequency.value=f*h;g.gain.value=[1,.30,.12][i];o.connect(g);g.connect(out);o.start(now);o.stop(now+1.2)})
}catch(e){}
}
function updateInfo(s,f,midi){
document.getElementById("stringInfo").textContent=s+" 弦";
document.getElementById("fretInfo").textContent=f===0?"空弦":f+" 品";
document.getElementById("noteInfo").textContent=noteName(midi);
document.getElementById("freqInfo").textContent=freq(midi).toFixed(1)+" Hz";
}
function buildCells(){
var rows=document.querySelectorAll(".stringRow");
Array.prototype.forEach.call(rows,function(row){
while(row.children.length>1)row.removeChild(row.lastChild);
var s=parseInt(row.getAttribute("data-string"),10),openMidi=parseInt(row.getAttribute("data-open-midi"),10);
for(var fret=0;fret<=12;fret++){
(function(f){
var midi=openMidi+f,c=document.createElement("div");c.className="cell"+(f===0?" nut":"");
if(showNotes){var nl=document.createElement("span");nl.className="noteLabel";nl.textContent=noteName(midi);c.appendChild(nl)}
var k=key(s,f);
if(marks[k]){var m=document.createElement("div");m.className="marker m"+marks[k];m.textContent=marks[k];c.appendChild(m)}
c.addEventListener("click",function(){updateInfo(s,f,midi);play(midi);snapshot();if(erase)delete marks[k];else marks[k]=selected;save();buildCells()});
row.appendChild(c)
})(fret)
}
})
}
var fingerBtns=document.querySelectorAll("[data-finger]");
Array.prototype.forEach.call(fingerBtns,function(btn){
btn.addEventListener("click",function(){
selected=btn.getAttribute("data-finger");erase=false;
Array.prototype.forEach.call(fingerBtns,function(b){b.classList.remove("active")});
btn.classList.add("active");
var names=["","食指","中指","无名指","小指"];
document.getElementById("status").textContent="当前工具："+selected+" "+names[parseInt(selected,10)]
})
});
document.getElementById("eraseBtn").addEventListener("click",function(){erase=true;Array.prototype.forEach.call(fingerBtns,function(b){b.classList.remove("active")});document.getElementById("status").textContent="当前工具：删除"});
document.getElementById("clearBtn").addEventListener("click",function(){snapshot();marks={};save();buildCells();document.getElementById("status").textContent="已清空"});
document.getElementById("undoBtn").addEventListener("click",function(){if(!history.length)return;marks=JSON.parse(history.pop());save();buildCells();document.getElementById("status").textContent="已撤销"});
document.getElementById("noteToggle").addEventListener("click",function(){showNotes=!showNotes;this.classList.toggle("on",showNotes);this.textContent="显示音名："+(showNotes?"开":"关");buildCells()});
document.getElementById("soundToggle").addEventListener("click",function(){soundOn=!soundOn;this.classList.toggle("on",soundOn);this.textContent="点击发声："+(soundOn?"开":"关")});
buildCells();
})();
</script>
</body>
</html>
